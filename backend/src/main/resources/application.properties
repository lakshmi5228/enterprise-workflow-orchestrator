# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Identity
spring.application.name=enterprise-workflow-orchestrator

# MySQL Datasource Configuration (Default)
spring.datasource.url=jdbc:mysql://localhost:3306/yottaflex_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
# Using database-platform avoids the HHH90000025 deprecation warning
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Data seed directory relative to backend working directory
synthetic.data.dir=../synthetic_data/exports
